name: Bump all repos to new GAMA version
run-name: "Bump → ${{ inputs.new_branch }} (Eclipse ${{ inputs.eclipse_release }})"

# Dispatch from the p2composite repo Actions tab.
# Requires ORG_DISPATCH_TOKEN with contents:write + administration:write on all
# gama-platform-plugin repos.

on:
  workflow_dispatch:
    inputs:
      new_branch:
        description: "New branch name (e.g. GAMA_2026-04)"
        required: true
      from_branch:
        description: "Base branch to create from"
        required: true
        default: "GAMA_2025-06"
      eclipse_release:
        description: "Eclipse release for p2 repo URL (e.g. 2025-06)"
        required: true
        default: "2025-03"
      deps_to_add:
        description: "Comma-separated org.gama artifactIds to add to <dependencies>"
        required: false
        default: ""
      deps_to_remove:
        description: "Comma-separated org.gama artifactIds to remove from <dependencies>"
        required: false
        default: ""
      tycho_version:
        description: "Tycho version to set in gama.parent/pom.xml (e.g. 4.0.9)"
        required: false
        default: ""
      jdk_version:
        description: "JDK version to set in gama.parent/pom.xml (e.g. 21)"
        required: false
        default: ""

env:
  ORG: gama-platform-plugin

jobs:
  # ── Job 1: discover repos ───────────────────────────────────────────────────
  list-repos:
    name: List plugin repos
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}

    steps:
      - name: Query org repos
        id: list
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
        run: |
          # Same filter as generate_composite.sh:
          # non-archived, no "template" or "no-p2" topic.
          PLUGIN_REPOS=$(gh api "orgs/${ORG}/repos" \
              --paginate \
              --jq '[.[] | select(.archived == false)
                         | select(.topics | (contains(["template"]) or contains(["no-p2"])) | not)
                         | .name]')

          # gama.plugin.template carries the "template" topic so it's excluded above;
          # add it explicitly because we want to bump it too.
          REPOS=$(echo "$PLUGIN_REPOS" | jq -c '. + ["gama.plugin.template", "p2composite"]')

          echo "repos=${REPOS}" >> "$GITHUB_OUTPUT"
          echo "Repos to bump: $(echo "$REPOS" | jq -r '.[]' | tr '\n' ' ')"

  # ── Job 2: bump each repo ───────────────────────────────────────────────────
  bump:
    name: "Bump ${{ matrix.repo }}"
    needs: list-repos
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJson(needs.list-repos.outputs.repos) }}
      fail-fast: false   # keep bumping other repos if one fails

    steps:
      # 1. Check out the target repo into the default workspace root first
      - name: Checkout ${{ matrix.repo }} @ ${{ inputs.from_branch }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ORG }}/${{ matrix.repo }}
          ref: ${{ inputs.from_branch }}
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}

      # 2. Fetch majorBumpRepoPlugin.sh from p2composite into a separate subdirectory
      # Swapping this to be second prevents it from being wiped by the first checkout.
      - name: Checkout p2composite (bump script)
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ORG }}/p2composite
          ref: ${{ inputs.from_branch }}
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}
          path: bump-tools

      - name: Install xmlstarlet
        run: sudo apt-get install -y xmlstarlet

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump versions and push ${{ inputs.new_branch }}
        env:
          NEW_BRANCH: ${{ inputs.new_branch }}
          ECLIPSE_RELEASE: ${{ inputs.eclipse_release }}
          DEPS_TO_ADD: ${{ inputs.deps_to_add }}
          DEPS_TO_REMOVE: ${{ inputs.deps_to_remove }}
          TYCHO_VERSION: ${{ inputs.tycho_version }}
          JDK_VERSION: ${{ inputs.jdk_version }}
          REPO: ${{ matrix.repo }}
        run: |
          FLAGS=""
          [[ "$REPO" == "gama.plugin.template" ]] && FLAGS="--is-template"
          [[ -n "$DEPS_TO_ADD"     ]] && FLAGS="$FLAGS --deps-to-add     $DEPS_TO_ADD"
          [[ -n "$DEPS_TO_REMOVE"  ]] && FLAGS="$FLAGS --deps-to-remove  $DEPS_TO_REMOVE"
          [[ -n "$TYCHO_VERSION"   ]] && FLAGS="$FLAGS --tycho-version   $TYCHO_VERSION"
          [[ -n "$JDK_VERSION"     ]] && FLAGS="$FLAGS --jdk-version     $JDK_VERSION"

          bash "$GITHUB_WORKSPACE"/bump-tools/majorBumpRepoPlugin.sh \
            --repo-dir . \
            --branch  "$NEW_BRANCH" \
            --eclipse "$ECLIPSE_RELEASE" \
            $FLAGS

      - name: Set ${{ inputs.new_branch }} as default branch
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
        run: |
          gh api --method PATCH "repos/${ORG}/${{ matrix.repo }}" \
              -f "default_branch=${{ inputs.new_branch }}"
          echo "✓ Default branch → ${{ inputs.new_branch }}"
