name: Update P2 Composite
run-name: "Update P2 Composite (${{ github.event.client_payload.repo || 'manual' }})"

on:
  repository_dispatch:
    types: [plugin-deployed]
  workflow_dispatch: # manual fallback

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.GAMA_SERVER_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.GAMA_SERVER_SSH_KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Log triggering repo
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "Triggered by: ${CLIENT_PAYLOAD_REPO}"
          echo "Plugin name:  ${CLIENT_PAYLOAD_NAME}"
        env:
          CLIENT_PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
          CLIENT_PAYLOAD_NAME: ${{ github.event.client_payload.name }}

      - name: Regenerate and deploy composite
        run: bash generate_composite.sh
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
          GITHUB_ORG: ${{ github.repository_owner }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GAMA_SERVER_USERNAME: ${{ secrets.GAMA_SERVER_USERNAME }}
